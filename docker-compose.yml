services:
  nats:
    image: nats:latest
    container_name: nats-sample
    command: "-js -sd /data -m 8222"
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring (http://localhost:8222)
      - "6222:6222"   # cluster routing (unused here, kept for completeness)
    volumes:
      - ./data:/data
